<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c14">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>CineOrbit</title>
<link rel="icon" id="fav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c14;--panel:#161827;--panel2:#1d2033;--line:rgba(255,255,255,.1);--mut:#a4a8bd;--acc:#5b8cff;--pad:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 500px at 15% -10%,rgba(91,140,255,.13),transparent 60%),radial-gradient(700px 400px at 100% 10%,rgba(168,85,247,.1),transparent 60%);pointer-events:none;z-index:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg,img{display:block}
a{color:inherit}
.wrap{position:relative;z-index:1;max-width:1500px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad) 8px}
.avatar{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.18);flex:none;transition:.2s}
.avatar:hover{transform:scale(1.06);border-color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.nav{display:flex;gap:26px;align-items:center}
.nav a{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;color:var(--mut);text-decoration:none;cursor:pointer;transition:.2s}
.nav a svg{width:26px;height:26px}
.nav a.on,.nav a:hover{color:#fff}
.live-dot{width:8px;height:8px;border-radius:50%;background:#ff3b4e;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,78,.7)}70%{box-shadow:0 0 0 9px rgba(255,59,78,0)}100%{box-shadow:0 0 0 0 rgba(255,59,78,0)}}
.iconbtn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(10px);transition:.2s;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.16)}
.iconbtn svg{width:24px;height:24px}
.chips{margin:10px var(--pad) 18px;padding:8px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;backdrop-filter:blur(12px)}
.chips::-webkit-scrollbar{display:none}
.chip{padding:12px 22px;border-radius:999px;font-weight:700;font-size:16px;color:#d6d9ea;white-space:nowrap;transition:.25s}
.chip:hover{background:rgba(255,255,255,.1)}
.chip.on{background:#fff;color:#000}
/* hero */
.hero{margin:0 var(--pad);position:relative}
.heroscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:28px}
.heroscroll::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative;aspect-ratio:16/9.3;max-height:560px;min-height:300px;border-radius:28px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:var(--panel)}
.slide .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;transition:transform 6s ease}
.slide:hover .bg{transform:scale(1.04)}
.slide .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,7,13,.95) 0%,rgba(6,7,13,.55) 38%,transparent 70%),linear-gradient(90deg,rgba(6,7,13,.7),transparent 60%)}
.slide .info{position:absolute;left:28px;right:28px;bottom:24px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.tag{background:#fff;color:#000;font-weight:700;font-size:14px;padding:7px 15px;border-radius:9px}
.slide .logo{max-width:min(62%,380px);max-height:100px;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6))}
.slide h2{font-size:clamp(26px,5vw,52px);font-weight:800;line-height:1.05;letter-spacing:-.02em;max-width:80%}
.slide .sub{font-weight:700;font-size:clamp(15px,2.4vw,20px)}
.meta{display:flex;align-items:center;gap:10px;color:#e6e8f5;font-weight:500;font-size:15px;flex-wrap:wrap}
.age{display:inline-grid;place-items:center;min-width:28px;height:26px;padding:0 7px;border-radius:5px;font-weight:800;font-size:13px;color:#fff}
.a-L{background:#16a34a}.a-10{background:#2563eb}.a-12{background:#eab308;color:#000}.a-14{background:#f97316}.a-16{background:#e11d2e}.a-18{background:#111;border:1px solid #666}
.dots{display:flex;justify-content:center;gap:9px;margin:16px 0 4px}
.dots i{width:9px;height:9px;border-radius:99px;background:rgba(255,255,255,.28);transition:.3s;cursor:pointer}
.dots i.on{width:30px;background:#e8e8ee}
/* rows */
.rowsec{margin-top:26px}
.rowsec h3{font-size:22px;font-weight:800;padding:0 var(--pad) 4px;letter-spacing:-.01em}
.rowwrap{position:relative}
.row{display:flex;gap:14px;overflow-x:auto;padding:12px var(--pad) 16px;scrollbar-width:none;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
/* setas só aparecem ao clicar nos cantos */
.edge{position:absolute;top:0;bottom:0;width:var(--pad);z-index:3;cursor:pointer}
.edge.l{left:0}.edge.r{right:0}
.arrow{position:absolute;top:0;bottom:0;width:54px;z-index:5;display:grid;place-items:center;background:rgba(10,11,20,.82);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.arrow.l{left:0;border-radius:0 18px 18px 0}.arrow.r{right:0;border-radius:18px 0 0 18px}
.arrow.vis{opacity:1;pointer-events:auto}
.arrow:hover{background:rgba(30,33,55,.95)}
.arrow svg{width:24px;height:24px}
.hero .edge{width:56px;bottom:40px}
.hero .arrow{width:54px;height:54px;top:calc(50% - 46px);bottom:auto;border-radius:50%;border:1px solid var(--line)}
.hero .arrow.l{left:12px}.hero .arrow.r{right:12px}
.card{flex:0 0 auto;width:188px;aspect-ratio:2/3;border-radius:22px;overflow:hidden;position:relative;border:1px solid var(--line);cursor:pointer;background:var(--panel);scroll-snap-align:start;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 18px 40px rgba(0,0,0,.55);z-index:2}
.card img{width:100%;height:100%;object-fit:cover}
.card .badge{position:absolute;top:10px;left:10px;background:#fff;color:#000;font-weight:700;font-size:12.5px;padding:5px 11px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 11px;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);font-weight:700;font-size:14px;line-height:1.2;opacity:0;transition:.25s}
.card:hover .nm{opacity:1}
.land{width:310px;aspect-ratio:16/9;border-radius:20px}
.land .nm{opacity:1;font-size:15px}
.land .pl{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)}
.land .pl svg{width:18px;height:18px}
.land .rm{position:absolute;left:10px;top:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:14px;z-index:2}
.land .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}
.land .bar i{display:block;height:100%;background:#e11d2e}
.skel{flex:0 0 auto;width:188px;aspect-ratio:2/3;border-radius:22px;background:linear-gradient(100deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:0 var(--pad)}
.grid .card{width:100%}
.hubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:6px var(--pad)}
.hub{height:120px;border-radius:24px;display:grid;place-items:center;font-weight:800;font-size:24px;cursor:pointer;border:1px solid var(--line);transition:.25s;letter-spacing:-.02em}
.hub:hover{transform:translateY(-5px) scale(1.02)}
.sectitle{padding:0 var(--pad) 14px;font-size:22px;font-weight:800;margin-top:26px}
.empty{color:var(--mut);padding:30px var(--pad);font-weight:600}
/* top 10 */
.rowsec.top10 .row{gap:0;padding-left:calc(var(--pad) - 4px)}
.t10{flex:0 0 auto;display:flex;align-items:flex-end;position:relative;scroll-snap-align:start;margin-right:10px}
.t10 .num{font-size:150px;line-height:.8;font-weight:800;letter-spacing:-.05em;color:#0b0c14;-webkit-text-stroke:4px rgba(255,255,255,.82);margin-right:-16px;margin-bottom:8px;padding-left:6px;z-index:1;user-select:none;pointer-events:none}
.t10 .card{position:relative;z-index:2;width:150px;flex:none}
@media(min-width:900px){.t10 .card{width:172px}.t10 .num{font-size:176px}}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:15px;text-decoration:none;transition:.2s}
.gbtn:hover{background:#2a2e48}
/* details */
.dhero{position:relative;min-height:560px;padding:0 var(--pad)}
.back{position:absolute;top:14px;left:var(--pad);z-index:6;height:46px;padding:0 20px;border-radius:99px;background:rgba(10,11,20,.6);backdrop-filter:blur(10px);border:1px solid var(--line);font-weight:800;display:flex;align-items:center;gap:6px;transition:.2s}
.back:hover{background:rgba(255,255,255,.2)}
.back.x{left:auto;right:var(--pad);width:46px;padding:0;justify-content:center;font-size:18px}
.dbg{position:absolute;inset:0 0 auto 0;height:640px;overflow:hidden;z-index:0}
.dbg img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.dbg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 2%,rgba(11,12,20,.82) 40%,rgba(11,12,20,.3) 80%),linear-gradient(90deg,rgba(11,12,20,.8),transparent 70%)}
.dcont{position:relative;z-index:2;padding-top:300px;max-width:760px}
.dcont .logo{max-width:min(80%,420px);max-height:130px;object-fit:contain;object-position:left bottom;margin-bottom:6px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.7))}
.dcont h1{font-size:clamp(34px,7vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1}
.quals{display:flex;gap:8px;margin:18px 0 14px}
.q{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);font-weight:800;font-size:13px;padding:5px 10px;border-radius:5px;color:#e2e4f0}
.dmeta{color:#d8dbec;font-weight:500;font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dmeta b{opacity:.5}
.ov{margin:16px 0 24px;font-size:17px;line-height:1.55;color:#e7e9f6}
.btns{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.watch{display:flex;align-items:center;gap:12px;background:#fff;color:#000;font-weight:800;letter-spacing:.06em;font-size:17px;height:70px;padding:0 54px 0 36px;border-radius:99px;transition:.2s}
.watch:hover{transform:scale(1.04);box-shadow:0 10px 30px rgba(255,255,255,.18)}
.watch svg{width:24px;height:24px}
.rb{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(10px);transition:.2s}
.rb:hover{background:rgba(255,255,255,.2)}
.rb svg{width:26px;height:26px}
.tabs{display:flex;gap:34px;padding:34px 0 0;border-bottom:1px solid var(--line);margin:0 var(--pad);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:0 0 15px;font-weight:800;letter-spacing:.1em;font-size:16px;color:#8d91a8;position:relative;white-space:nowrap}
.tab.on{color:#fff}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px;background:#fff}
.tabbody{padding:22px var(--pad) 60px}
.ctrl{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pill{height:58px;border-radius:99px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 24px;font-weight:700;font-size:17px;position:relative}
.sel{position:relative;display:flex;align-items:center}
.sel select{-webkit-appearance:none;-moz-appearance:none;appearance:none;background:transparent;border:0;border-radius:0;color:#fff;font:inherit;font-weight:700;outline:0;padding:0 32px 0 0;margin:0;cursor:pointer;color-scheme:dark;text-overflow:ellipsis}
.sel select option{background:#161827;color:#fff}
.sel .chev{position:absolute;right:0;top:50%;width:18px;height:18px;margin-top:-9px;pointer-events:none}
.pill svg{width:20px;height:20px}
.search-ep{width:100%;height:56px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:#fff;font:inherit;font-size:16px;padding:0 26px;outline:0;margin-bottom:22px}
.search-ep:focus{border-color:var(--acc)}
.cls{display:flex;align-items:center;gap:12px;font-weight:800;margin-bottom:6px;font-size:16px}
.clsd{color:var(--mut);font-size:16px;margin-bottom:20px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.ep{cursor:pointer}
.ep .still{aspect-ratio:16/9;border-radius:20px;overflow:hidden;position:relative;background:var(--panel);border:1px solid var(--line)}
.ep .still img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.ep:hover .still img{transform:scale(1.06)}
.ep .still .pl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.28);opacity:0;transition:.25s}
.ep:hover .still .pl{opacity:1}
.ep .pl span{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#000}
.ep .pl svg{width:26px;height:26px}
.ep .dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.7);font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:7px}
.ep .t{margin-top:12px;font-weight:800;font-size:17px}
.ep p{color:var(--mut);font-size:14.5px;line-height:1.5;margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;max-width:1000px}
.det div b{display:block;color:var(--mut);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.det div span{font-weight:600;font-size:16px;line-height:1.45}
.cast{display:flex;gap:16px;overflow-x:auto;margin-top:16px;padding-bottom:8px;scrollbar-width:none}
.cast div{flex:0 0 100px;text-align:center;font-size:13px;font-weight:600}
.cast img,.cast i{width:88px;height:88px;border-radius:50%;object-fit:cover;margin:0 auto 8px;background:var(--panel);display:block}
.cast small{display:block;color:var(--mut);font-weight:500;margin-top:2px}
/* trailer */
.trailerbox,.tbox{aspect-ratio:16/9;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#000;position:relative}
.trailerbox{max-width:980px}
.tbox iframe,.tbox>div{width:100%;height:100%;border:0}
.tfail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 0,#1d2033,#0b0c14)}
.tfail b{font-size:18px}.tfail p{color:var(--mut);font-size:14px;max-width:460px;line-height:1.5}
.tfail .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.loadtxt{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-weight:700}
/* overlays */
.ov-full{position:fixed;inset:0;z-index:50;background:rgba(5,6,12,.97);backdrop-filter:blur(14px);display:none;flex-direction:column}
.ov-full.show{display:flex}
.pbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top))}
.pbar .ttl{flex:1 1 160px;min-width:0}
.pbar .ttl b{display:block;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .ttl small{display:block;color:var(--mut);font-weight:600;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar button.sm{height:44px;padding:0 16px;border-radius:99px;background:rgba(255,255,255,.1);font-weight:700;font-size:14px;border:1px solid var(--line);white-space:nowrap}
.pbar button.sm:hover{background:rgba(255,255,255,.22)}
.pframe{flex:1;display:flex;align-items:center;justify-content:center;padding:0 0 max(10px,env(safe-area-inset-bottom));min-height:0}
.pframe iframe{width:100%;height:100%;max-width:1400px;border:0;background:#000}
.pframe .tbox{width:min(100%,1300px);margin:0 14px}
.sbox{padding:18px var(--pad) 8px;display:flex;gap:12px;align-items:center}
.sbox input{flex:1;height:58px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:#fff;font:inherit;font-size:17px;padding:0 26px;outline:0}
.sbox input:focus{border-color:var(--acc)}
.sres{overflow:auto;flex:1;padding:14px 0 40px}
/* perfis */
#profiles{position:fixed;inset:0;z-index:100;background:radial-gradient(900px 600px at 50% -10%,rgba(91,140,255,.22),transparent 60%),radial-gradient(600px 400px at 90% 100%,rgba(255,95,162,.12),transparent 60%),#07080f;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:auto;text-align:center}
#profiles.show{display:flex}
.brand{font-weight:800;font-size:26px;letter-spacing:-.02em;margin-bottom:30px;display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:14px;object-fit:cover}
#profiles h1{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-.03em;margin-bottom:34px}
.plist{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;max-width:900px}
.pf{width:150px;cursor:pointer;position:relative;transition:.25s}
.pf .pa{width:150px;height:150px;border-radius:50%;overflow:hidden;border:3px solid transparent;transition:.25s;position:relative;background:var(--panel)}
.pf:hover .pa{border-color:#fff;transform:scale(1.07)}
.pf .pa img{width:100%;height:100%;object-fit:cover}
.pf .pn{margin-top:14px;font-weight:700;font-size:18px;color:#cfd2e4}
.pf:hover .pn{color:#fff}
.pf .kid{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.08em;color:#000;background:#ffd54a;padding:3px 9px;border-radius:99px}
.pf .edt{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center}
.manage .pf .edt{display:grid}
.pf .edt svg{width:42px;height:42px}
.pf.add .pa{display:grid;place-items:center;border:2px dashed rgba(255,255,255,.25)}
.pf.add svg{width:48px;height:48px;color:#aab}
.mbtn{margin-top:46px;padding:15px 34px;border-radius:99px;border:1.5px solid rgba(255,255,255,.35);font-weight:800;letter-spacing:.1em;font-size:14px;color:#cfd2e4;transition:.2s}
.mbtn:hover{border-color:#fff;color:#fff}
.mbtn.on{background:#fff;color:#000}
.modal{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.mbox{background:#12141f;border:1px solid var(--line);border-radius:28px;padding:26px;width:100%;max-width:540px;max-height:94vh;overflow:auto}
.mbox h2{font-size:24px;font-weight:800;margin-bottom:18px}
.prev{width:104px;height:104px;border-radius:50%;overflow:hidden;margin:0 auto 16px;border:3px solid #fff;background:var(--panel)}
.prev img{width:100%;height:100%;object-fit:cover}
.ninput{width:100%;height:54px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:#fff;font:inherit;font-size:16px;padding:0 18px;outline:0;margin-bottom:14px}
.ninput:focus{border-color:var(--acc)}
.atabs{display:flex;gap:6px;background:var(--panel);border-radius:99px;padding:5px;margin-bottom:14px}
.at{flex:1;height:42px;border-radius:99px;font-weight:700;font-size:14px;color:#b9bdd3}
.at.on{background:#fff;color:#000}
#ap{min-height:150px;margin-bottom:6px}
.apick{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.apick img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;cursor:pointer;border:3px solid transparent;transition:.2s}
.apick img:hover{transform:scale(1.1)}
.apick img.on{border-color:#fff}

const cache=new Map();
async function tmdb(path,params={}){
  const q=new URLSearchParams({language:'pt-BR',...params});
  const url=`${API}${path}?${q}`;
  if(cache.has(url))return cache.get(url);
  const p=fetch(url,{headers:{Authorization:'Bearer '+TOKEN,accept:'application/json'}}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).catch(e=>{cache.delete(url);throw e});
  cache.set(url,p);return p;
}
async function L(path,params={},type){
  try{const d=await tmdb(path,params);
    return (d.results||[]).map(r=>({...r,media_type:type||r.media_type||(r.title?'movie':'tv')})).filter(r=>(r.media_type==='movie'||r.media_type==='tv')&&r.poster_path);
  }catch{return []}
}

const yearOf=i=>(i.release_date||i.first_air_date||'').slice(0,4);
function isRecent(i){const d=i.release_date||i.first_air_date;if(!d)return false;return (Date.now()-new Date(d))/864e5<400}
function certOf(d,type){
  const mapUS={G:'L',PG:'10','PG-13':'12',R:'16','NC-17':'18','TV-Y':'L','TV-Y7':'10','TV-G':'L','TV-PG':'10','TV-14':'14','TV-MA':'18'};
  const norm=c=>{c=String(c||'').trim();if(!c)return '';if(['L','10','12','14','16','18'].includes(c))return c;if(/^livre/i.test(c))return 'L';return mapUS[c]||''};
  if(type==='movie'){
    const rs=d.release_dates?.results||[];
    for(const cc of ['BR','US']){const r=rs.find(x=>x.iso_3166_1===cc);const c=r?.release_dates?.map(x=>x.certification).find(Boolean);if(norm(c))return norm(c)}
  }else{
    const rs=d.content_ratings?.results||[];
    for(const cc of ['BR','US']){const r=rs.find(x=>x.iso_3166_1===cc);if(r&&norm(r.rating))return norm(r.rating)}
  }
  return '';
}

  const reveal=()=>{const max=sc.scrollWidth-sc.clientWidth;aL.classList.toggle('vis',sc.scrollLeft>8);aR.classList.toggle('vis',sc.scrollLeft<max-8);clearTimeout(t);t=setTimeout(()=>{aL.classList.remove('vis');aR.classList.remove('vis')},3500)};

/* ============ TRAILER (tenta vários vídeos, com plano B) ============ */
let ytReady;
function loadYT(){
  if(window.YT&&YT.Player)return Promise.resolve();
  if(!ytReady)ytReady=new Promise(res=>{const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{prev&&prev();res()};const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>res();document.head.appendChild(s)});
  return Promise.race([ytReady,new Promise(r=>setTimeout(r,6000))]);
}
function sortedVideos(d){
  const vs=(d.videos?.results||[]).filter(v=>v.site==='YouTube'||v.site==='Vimeo');
  const sc=v=>(v.type==='Trailer'?50:v.type==='Teaser'?25:v.type==='Clip'?5:0)+(v.iso_639_1==='pt'?20:v.iso_639_1==='en'?10:0)+(v.official?5:0)+(v.site==='YouTube'?1:0);
  return [...vs].sort((a,b)=>sc(b)-sc(a));
}
function mountTrailer(box,d,name){
  const vids=sortedVideos(d);let n=0,timer;
  const q=encodeURIComponent((name||title(d))+' trailer oficial');
  const ext=vids[0]?.site==='YouTube'?`https://www.youtube.com/watch?v=${vids[0].key}`:`https://www.youtube.com/results?search_query=${q}`;
  const fail=()=>{
    clearTimeout(timer);
    const local=location.protocol==='file:';
    box.innerHTML=`<div class="tfail"><b>${vids.length?'Não deu para reproduzir o trailer aqui':'Este título não tem trailer cadastrado'}</b><p>${local?'O YouTube bloqueia vídeos quando o site é aberto direto do arquivo. Hospede o site (qualquer endereço http/https) e o trailer toca normal aqui dentro.':'O vídeo pode estar bloqueado para incorporação. Você pode assistir direto no YouTube.'}</p><div class="row2"><a class="gbtn" target="_blank" rel="noopener" href="${ext}">▶ ${vids.length?'Abrir no YouTube':'Buscar no YouTube'}</a>${vids.length?'<button class="gbtn" id="trr">Tentar de novo</button>':''}</div></div>`;
    const r=$('#trr',box);if(r)r.onclick=()=>{n=0;next()};
  };
  const next=async()=>{
    clearTimeout(timer);
    if(!document.body.contains(box))return;
    if(n>=vids.length)return fail();
    const v=vids[n++];
    box.innerHTML='<div class="loadtxt">Carregando trailer...</div><div id="ytp" style="position:absolute;inset:0"></div>';
    if(v.site==='Vimeo'){box.innerHTML=`<iframe src="https://player.vimeo.com/video/${v.key}?autoplay=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;return}
    await loadYT();
    if(!(window.YT&&YT.Player))return fail();
    const vars={autoplay:1,rel:0,playsinline:1,modestbranding:1};
    if(/^https?:/.test(location.protocol))vars.origin=location.origin;
    timer=setTimeout(next,9000);
    try{new YT.Player('ytp',{videoId:v.key,host:'https://www.youtube-nocookie.com',playerVars:vars,events:{onReady:e=>{clearTimeout(timer);const l=$('.loadtxt',box);if(l)l.remove();try{e.target.playVideo()}catch{}},onError:()=>next()}})}catch{next()}
  };
  next();
}

      $('#pp').onclick=()=>{const {idx}=pos();if(e>1)e--;else if(idx>0){s=seasons[idx-1].season_number;e=seasons[idx-1].episode_count}else{toast('Este é o primeiro episódio');return}save();draw()};
    }
  };
  draw();
